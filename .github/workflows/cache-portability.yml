name: cache-portability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cache-portability-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cache-lifecycle:
    name: Cache lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Execute installed hooks and real platform lifecycle
        run: node scripts/run-with-cache.mjs -- node --test --test-concurrency=2 scripts/build-cache.test.mjs scripts/build-cache-policy.test.mjs scripts/build-cache-nested.test.mjs scripts/build-vsix-output.test.mjs scripts/docker-cache-budget.test.mjs scripts/build-resource-monitor.test.mjs scripts/build-output-publication.test.mjs scripts/ci-source-context.test.mjs scripts/cargo-unit-sweep.test.mjs
      - name: Archive platform evidence before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-portability-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  measured-native-cycle:
    # R164: measured before/after bytes for a native development cycle, then a
    # clean rebuild that must still pass the full JavaScript and Rust suites and
    # the required native oracles. The report is written even on failure.
    name: Measured native clean-rebuild cycle
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install locked JavaScript dependencies
        run: node scripts/run-with-cache.mjs -- npm --prefix js ci
      - name: Install editor runtime providers for source-free integration tests
        run: node scripts/run-with-cache.mjs -- npm --prefix vscode ci --omit=dev
      - name: Install official Lean 4.34.1 toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Measure build, full clean, clean rebuild and full verification
        run: node scripts/measure-build-cache.mjs .rml-cache/evidence/build-cache-measurement-native.json --native --oracles=Rust,Lean
      - name: Archive measurement before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-cache-measurement-native-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full
