name: crates-release

# Rust publication is separate from npm's release.yml. Register this exact
# filename as the crates.io trusted publisher; see docs/RELEASING.md.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/crates-release.yml'
      - 'rust/**'
      - 'scripts/crates-release*'
      - 'docs/RELEASING.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/crates-release.yml'
      - 'rust/**'
      - 'scripts/crates-release*'
      - 'docs/RELEASING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Rust package (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Test release helper and policy
        run: node scripts/run-with-cache.mjs -- node --test scripts/crates-release.test.mjs
      # Builds the packaged library and every binary. The full language suites
      # run in tests.yml.
      - name: Verify crates.io package (dry run)
        working-directory: rust
        run: node ../scripts/run-with-cache.mjs --isolate-output rust/target -- cargo publish --dry-run --locked
      - name: Check whether this version is already on crates.io
        id: check
        run: node scripts/crates-release.mjs check

      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-diagnostics-crates-validate-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  publish:
    name: crates.io (relative-meta-logic)
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Authenticate with crates.io (trusted publishing)
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        continue-on-error: true
      - name: Publish to crates.io (OIDC first, token fallback)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: node scripts/run-with-cache.mjs --isolate-output rust/target -- node scripts/crates-release.mjs publish
      - name: Verify registry visibility
        run: node scripts/crates-release.mjs verify

      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-diagnostics-crates-publish-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  prm-publish-npm-1:
    if: (github.event_name == 'release' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    concurrency:
      group: prm-publish-npm-1-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install npm 11
        run: npm install --global npm@^11
      - name: Install JavaScript dependencies
        working-directory: js
        run: node ../scripts/run-with-cache.mjs -- npm ci
      - name: Run the package build when defined
        working-directory: js
        run: node ../scripts/run-with-cache.mjs -- npm run build --if-present
      - name: Check exact registry version
        id: version-check
        working-directory: js
        run: |
          python3 - <<'PY'
          import json, os, time, tomllib, urllib.request, urllib.error, urllib.parse
          metadata = json.load(open("package.json"))
          name, version = metadata["name"], metadata["version"]
          expected = os.environ.get("RELEASE_VERSION", "").removeprefix("v")
          if expected and version != expected: raise SystemExit("Checkout version does not match release output")
          url = "https://registry.npmjs.org/" + urllib.parse.quote(name, safe="") + "/" + version + "?_=" + str(time.time_ns())
          request = urllib.request.Request(url, headers={"Cache-Control": "no-cache, no-store", "User-Agent": "package-registry-manager", "Accept": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  json.load(response)
              publish = False
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              publish = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("publish=" + str(publish).lower() + "\n")
          PY
      - name: Publish through OIDC
        working-directory: js
        run: node ../scripts/run-with-cache.mjs -- npm publish --provenance --access public
        if: steps.version-check.outputs.publish == 'true'
        id: prm_oidc_1
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_AUTH_TOKEN: ''
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Publish with token fallback
        working-directory: js
        run: node ../scripts/run-with-cache.mjs -- npm publish --provenance --access public
        if: steps.prm_oidc_1.outcome == 'failure'
        id: prm_oidc_1_fallback
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-diagnostics-prm-npm-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full
