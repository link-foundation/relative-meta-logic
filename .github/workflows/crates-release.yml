name: crates-release

# This workflow is the trusted publisher for both registries.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/crates-release.yml'
      - 'rust/**'
      - 'scripts/crates-release*'
      - 'experiments/issue-185/verify-packaged-core.sh'
      - 'docs/RELEASING.md'
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - '.github/workflows/crates-release.yml'
      - '.github/workflows/release.yml'
      - 'rust/**'
      - 'js/**'
      - 'scripts/crates-release*'
      - 'scripts/npm-release*'
      - 'experiments/issue-185/verify-packaged-core.sh'
      - 'docs/RELEASING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Rust package (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: ${{ github.ref_type != 'tag' && 1 || 0 }}
      - name: Require release tags to point to a commit on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Test release helper and policy
        run: node --test scripts/crates-release.test.mjs scripts/npm-release.test.mjs
      - name: Check whether this version is already on crates.io
        id: check
        run: node scripts/crates-release.mjs check
      - name: Verify crates.io package (dry run)
        working-directory: rust
        run: cargo publish --dry-run --locked
      - name: Test probability core without default features
        working-directory: rust
        run: cargo test --locked --no-default-features --features core --test probability
      # cargo publish stages an archive temporarily. cargo package retains
      # the archive for the downstream consumer check.
      - name: Create the crate archive for the consumer test
        working-directory: rust
        run: cargo package --locked --no-verify
      - name: Build a fresh WebAssembly consumer of the packaged core
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: bash experiments/issue-185/verify-packaged-core.sh "rust/target/package/relative-meta-logic-$VERSION.crate"

  publish:
    name: crates.io (relative-meta-logic)
    needs: validate
    if: >-
      needs.validate.outputs.should_publish == 'true' &&
      ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'push' && github.ref_type == 'tag'))
    concurrency:
      group: publish-crate-${{ needs.validate.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Check version again after acquiring the publish lock
        id: check
        run: node scripts/crates-release.mjs check
      - name: Authenticate with crates.io (trusted publishing)
        if: steps.check.outputs.should_publish == 'true'
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        continue-on-error: true
      - name: Publish to crates.io (OIDC first, token fallback)
        if: steps.check.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: node scripts/crates-release.mjs publish
      - name: Verify registry visibility
        if: steps.check.outputs.should_publish == 'true'
        run: node scripts/crates-release.mjs verify

  npm-validate:
    name: Validate npm release
    if: >-
      (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'push' && github.ref_type == 'tag')
    uses: ./.github/workflows/release.yml

  prm-publish-npm-1:
    name: npm (relative-meta-logic)
    needs: [validate, npm-validate]
    concurrency:
      group: publish-npm-${{ needs.validate.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the js-v<version> GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          npm --version
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@^11.5.1
            npm --version
          fi
      - name: Check exact registry version
        id: check
        run: node scripts/npm-release.mjs check
      - name: Build the package
        if: steps.check.outputs.should_publish == 'true'
        working-directory: js
        run: |
          npm ci
          npm run build --if-present
      - name: Publish to npm through OIDC
        if: steps.check.outputs.should_publish == 'true'
        id: npm_oidc
        continue-on-error: true
        run: node scripts/npm-release.mjs publish
      - name: Publish with token fallback
        if: steps.npm_oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
        run: node scripts/npm-release.mjs publish
      - name: Verify registry visibility
        if: steps.check.outputs.should_publish == 'true'
        run: node scripts/npm-release.mjs verify
      - name: Create GitHub release
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          NAME: ${{ steps.check.outputs.name }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$NAME $VERSION (npm)" \
              --notes "Published [$NAME@$VERSION](https://www.npmjs.com/package/$NAME/v/$VERSION) to npm."
          fi
