name: docker

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker.yml'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docs/BUILD_CACHE.md'
      - '.dockerignore'
      - 'docker/**'
      - 'js/**'
      - 'rust/**'
      - 'examples/**'
      - 'lib/**'
      - 'test-corpus/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker.yml'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docs/BUILD_CACHE.md'
      - '.dockerignore'
      - 'docker/**'
      - 'js/**'
      - 'rust/**'
      - 'examples/**'
      - 'lib/**'
      - 'test-corpus/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Build and smoke-test images in a project-owned builder
        env:
          RML_DOCKER_OWNER: ${{ github.repository }}
        run: node scripts/run-with-cache.mjs -- bash docker/ci-build.sh
      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-diagnostics-docker-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full
