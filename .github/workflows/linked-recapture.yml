name: linked-recapture

# Deliberate source migration on a hosted runner, so contributors never build the
# Rust syntax helper locally. Review and apply the patch uploaded by this job.
# A commit marked [recapture] on the issue branch can also request a patch
# when the workflow has not landed on the default branch yet.
on:
  push:
    branches: ['recapture/**', 'issue-183-7fedfddffe9c']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recapture:
    name: Recapture linked implementation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/recapture/') ||
      contains(github.event.head_commit.message, '[recapture]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Bootstrap repository cache policy
        run: node scripts/bootstrap.mjs
      # The authority guard refuses the drift this job exists to migrate, so the
      # install runs outside it; the migration itself is guarded and revalidated.
      - name: Install dependencies
        run: npm --prefix js ci
      - name: Regenerate certified bulk translation receipts
        run: |
          node scripts/sync-release-assets.mjs
          node scripts/generate-certified-bulk.mjs
      - name: Run the deliberate source migration
        run: node scripts/update-linked-implementation.mjs
      - name: Export the reviewed-migration patch
        run: |
          mkdir -p .rml-cache/evidence/recapture
          git add -A
          git diff --cached --binary > .rml-cache/evidence/recapture/linked-recapture.patch
          git diff --cached --stat
      - name: Upload the patch and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linked-recapture-patch
          path: .rml-cache/evidence/**
          include-hidden-files: true
      - name: Clean owned build outputs
        if: always()
        run: node scripts/build-cache.mjs --full
