name: orientation-proofs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/orientation-proofs.yml'
      - 'test-corpus/orientation-independence/**'
      - 'scripts/check-orientation-independence.mjs'
      - 'scripts/orientation-independence.test.mjs'
      - 'scripts/proof-toolchain-contract.test.mjs'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docker/run-owned.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/orientation-proofs.yml'
      - 'test-corpus/orientation-independence/**'
      - 'scripts/check-orientation-independence.mjs'
      - 'scripts/orientation-independence.test.mjs'
      - 'scripts/proof-toolchain-contract.test.mjs'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docker/run-owned.sh'
  workflow_dispatch:

jobs:
  lean:
    name: Lean orientation and consequence proofs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install official Lean 4.34.1 toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check all theorems, absence of axioms, and false-claim rejection
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.34.1
        run: |
          mkdir -p .rml-cache/evidence
          node scripts/run-with-cache.mjs --cache .rml-cache/lean --class lean -- bash -euo pipefail -c 'node scripts/check-orientation-independence.mjs --languages=Lean > .rml-cache/evidence/orientation-lean.json'
          node --test scripts/orientation-independence.test.mjs scripts/proof-toolchain-contract.test.mjs
      - name: Upload proof and cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orientation-lean-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  rocq:
    name: Rocq orientation and consequence proofs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install stable Rocq and check all proof obligations in one owned container
        run: |
          node scripts/run-with-cache.mjs --cache .rml-cache/rocq --class rocq -- bash -euo pipefail -c '
            mkdir -p .rml-cache/rocq/orientation-native .rml-cache/evidence
            runner_owner="$(id -u):$(id -g)"
            trap "sudo chown -R $runner_owner .rml-cache/rocq .rml-cache/evidence" EXIT
            sudo chown -R 1000:1000 .rml-cache/rocq .rml-cache/evidence
            bash docker/run-owned.sh --init \
              --volume "$PWD/scripts:/rml/scripts:ro" \
              --volume "$PWD/test-corpus/orientation-independence:/rml/test-corpus/orientation-independence:ro" \
              --volume "$PWD/.rml-cache/rocq/orientation-native:/rml-native" \
              --volume "$PWD/.rml-cache/evidence:/rml-evidence" \
              --volume "$(command -v node):/rml-node:ro" --workdir /rml \
              rocq/rocq-prover:9.3@sha256:c357e8864f80359db21725ea8371347a75a1cb439545b47219d7ad5683ba1782 \
              /bin/bash --login -ec \
              "/rml-node --version; bash /rml/scripts/install-rocq-kernel.sh; TMPDIR=/rml-native /rml-node /rml/scripts/check-orientation-independence.mjs --languages=Rocq > /rml-evidence/orientation-rocq.json"
          '
      - name: Upload proof and cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orientation-rocq-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full
