name: bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'js/**'
      - 'rust/src/linked_program.rs'
      - 'rust/tests/linked_program_tests.rs'
      - 'lib/meta-theory/**'
      - 'lib/self/**'
      - 'scripts/report-bootstrap-metrics.mjs'
      - 'test-corpus/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'js/**'
      - 'rust/src/linked_program.rs'
      - 'rust/tests/linked_program_tests.rs'
      - 'lib/meta-theory/**'
      - 'lib/self/**'
      - 'scripts/report-bootstrap-metrics.mjs'
      - 'test-corpus/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  encoded-rml-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci
      - name: Replay corpus through encoded RML
        working-directory: js
        run: npm run test:bootstrap
      - name: Publish measured bootstrap boundary
        working-directory: js
        run: npm run report:bootstrap-metrics
