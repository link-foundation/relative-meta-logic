name: api-docs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/api-docs.yml'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docs/BUILD_CACHE.md'
      - 'docs/api/**'
      - 'docs/playground/**'
      - 'js/**'
      - 'rust/**'
      - 'scripts/docs.test.mjs'
      - 'scripts/build-playground.mjs'
      - 'scripts/playground.test.mjs'
      - 'scripts/write-docs-index.mjs'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-docs.yml'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docs/BUILD_CACHE.md'
      - 'docs/api/**'
      - 'docs/playground/**'
      - 'js/**'
      - 'rust/**'
      - 'scripts/docs.test.mjs'
      - 'scripts/build-playground.mjs'
      - 'scripts/playground.test.mjs'
      - 'scripts/write-docs-index.mjs'
      - 'README.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install JavaScript dependencies
        working-directory: js
        run: node ../scripts/run-with-cache.mjs -- npm ci
      - name: Build and assemble API docs and playground
        run: |
          # Retain the deployable site until the upload steps consume it.
          node scripts/run-with-cache.mjs --retain _site -- bash -euo pipefail -c '
            cd js
            npm run build:playground
            npm run test:playground
            npm run docs -- --destination ../_site/api/js
            cd ..
            cargo doc --manifest-path rust/Cargo.toml --no-deps --target-dir target/api-docs/rust
            mkdir -p _site/api/rust
            cp -R target/api-docs/rust/doc/. _site/api/rust/
            node scripts/write-docs-index.mjs _site
          '
      - name: List built site (debug)
        run: |
          echo "::group::_site tree"
          find _site -maxdepth 3 -print
          echo "::endgroup::"
          echo "::group::_site/playground listing"
          ls -la _site/playground || echo "no _site/playground directory"
          echo "::endgroup::"
      - name: Configure GitHub Pages
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-diagnostics-api-docs-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  deploy:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Print resolved deployment URL (debug)
        run: |
          echo "Pages deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo "Playground should be reachable at: ${{ steps.deployment.outputs.page_url }}playground/"
