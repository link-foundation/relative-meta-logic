name: formal-corpus

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/formal-corpus.yml'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docs/BUILD_CACHE.md'
      - 'js/**'
      - 'rust/**'
      - 'lib/meta-theory/**'
      - 'scripts/check-meta-theory-corpus.mjs'
      - 'scripts/check-meta-theory-corpus.test.mjs'
      - 'scripts/generate-meta-theory-corpus.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-corpus.yml'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docs/BUILD_CACHE.md'
      - 'js/**'
      - 'rust/**'
      - 'lib/meta-theory/**'
      - 'scripts/check-meta-theory-corpus.mjs'
      - 'scripts/check-meta-theory-corpus.test.mjs'
      - 'scripts/generate-meta-theory-corpus.mjs'
  workflow_dispatch:

env:
  META_THEORY_REVISION: 087f4515d0652925eecc54bcade724445c3978f1

jobs:
  semantic-corpus:
    name: Linked semantic-source parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          repository: link-foundation/meta-theory
          ref: ${{ env.META_THEORY_REVISION }}
          path: upstream-meta-theory
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install JavaScript dependencies
        working-directory: js
        run: node ../scripts/run-with-cache.mjs -- npm ci
      - name: Compare linked syntax, declarations, and dependencies with pinned sources
        run: node scripts/run-with-cache.mjs -- node scripts/check-meta-theory-corpus.mjs upstream-meta-theory
      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-diagnostics-formal-semantic-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  lean:
    name: Lean build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          repository: link-foundation/meta-theory
          ref: ${{ env.META_THEORY_REVISION }}
          path: upstream-meta-theory
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install official Lean 4.34.1 toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build pinned Lean corpus in an owned scratch copy
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.34.1
        run: |
          node scripts/run-with-cache.mjs --cache .rml-cache/lean --class lean -- bash -euo pipefail -c '
            mkdir -p .rml-cache/lean/pinned
            cp -R upstream-meta-theory/drafts/0.0.3/src/lean/. .rml-cache/lean/pinned/
            cd .rml-cache/lean/pinned
            lean --version
            lake build
          '
      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-diagnostics-formal-lean-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  rocq:
    name: Rocq build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          repository: link-foundation/meta-theory
          ref: ${{ env.META_THEORY_REVISION }}
          path: upstream-meta-theory
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Build pinned Rocq corpus in an owned scratch copy
        run: |
          node scripts/run-with-cache.mjs --cache .rml-cache/rocq --class rocq -- bash -euo pipefail -c '
            mkdir -p .rml-cache/rocq/pinned
            cp -R upstream-meta-theory/drafts/0.0.3/src/rocq/. .rml-cache/rocq/pinned/
            runner_owner="$(id -u):$(id -g)"
            trap "sudo chown -R $runner_owner .rml-cache/rocq" EXIT
            sudo chown -R 1000:1000 .rml-cache/rocq
            bash docker/run-owned.sh --init \
              --volume "$PWD/.rml-cache/rocq/pinned:/work" --workdir /work \
              rocq/rocq-prover:9.3@sha256:c357e8864f80359db21725ea8371347a75a1cb439545b47219d7ad5683ba1782 /bin/bash --login -ec \
              "set -o pipefail; rocq --version | grep -E \"version 9[.]3[.]0([[:space:]]|$)\"; rocq makefile -f _CoqProject -o Makefile.coq; make -f Makefile.coq"
          '
      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-diagnostics-formal-rocq-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full
