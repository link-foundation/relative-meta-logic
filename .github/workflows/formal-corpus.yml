name: formal-corpus

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/formal-corpus.yml'
      - 'js/**'
      - 'rust/**'
      - 'lib/meta-theory/**'
      - 'scripts/check-meta-theory-corpus.mjs'
      - 'scripts/check-meta-theory-corpus.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-corpus.yml'
      - 'js/**'
      - 'rust/**'
      - 'lib/meta-theory/**'
      - 'scripts/check-meta-theory-corpus.mjs'
      - 'scripts/check-meta-theory-corpus.test.mjs'
  workflow_dispatch:

env:
  META_THEORY_REVISION: 087f4515d0652925eecc54bcade724445c3978f1

jobs:
  manifest:
    name: Source/manifest parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: link-foundation/meta-theory
          ref: ${{ env.META_THEORY_REVISION }}
          path: upstream-meta-theory
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci
      - name: Compare LiNo manifest with pinned formal sources
        run: node scripts/check-meta-theory-corpus.mjs upstream-meta-theory

  lean:
    name: Lean build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: link-foundation/meta-theory
          ref: ${{ env.META_THEORY_REVISION }}
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build pinned Lean corpus
        working-directory: drafts/0.0.3/src/lean
        run: lake build

  rocq:
    name: Rocq build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: link-foundation/meta-theory
          ref: ${{ env.META_THEORY_REVISION }}
      - name: Set container-compatible permissions
        run: sudo chown -R 1000:1000 .
      - name: Build pinned Rocq corpus
        uses: coq-community/docker-coq-action@v1
        with:
          custom_image: 'rocq/rocq-prover:9.1'
          custom_script: |
            cd drafts/0.0.3/src/rocq
            rocq makefile -f _CoqProject -o Makefile.coq
            make -f Makefile.coq
      - name: Restore runner permissions
        if: always()
        run: sudo chown -R 1001:116 .
