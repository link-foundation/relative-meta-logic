name: formal-corpus

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/formal-corpus.yml'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/external-checkouts.json'
      - 'scripts/linked-*'
      - 'lib/linked-runtime/**'
      - '.gitattributes'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docs/BUILD_CACHE.md'
      - 'js/**'
      - 'rust/**'
      - 'lib/meta-theory/**'
      - 'scripts/check-meta-theory-corpus.mjs'
      - 'scripts/check-meta-theory-corpus.test.mjs'
      - 'scripts/generate-meta-theory-corpus.mjs'
      - 'scripts/check-reference-exports.mjs'
      - 'scripts/reference-export*'
      - 'test-corpus/lino-frontend/reference-literals.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-corpus.yml'
      - 'scripts/build-cache*'
      - 'scripts/cache-policy.json'
      - 'scripts/external-checkouts.json'
      - 'scripts/linked-*'
      - 'lib/linked-runtime/**'
      - '.gitattributes'
      - 'scripts/run-with-cache.mjs'
      - 'scripts/bootstrap.mjs'
      - 'docs/BUILD_CACHE.md'
      - 'js/**'
      - 'rust/**'
      - 'lib/meta-theory/**'
      - 'scripts/check-meta-theory-corpus.mjs'
      - 'scripts/check-meta-theory-corpus.test.mjs'
      - 'scripts/generate-meta-theory-corpus.mjs'
      - 'scripts/check-reference-exports.mjs'
      - 'scripts/reference-export*'
      - 'test-corpus/lino-frontend/reference-literals.json'
  workflow_dispatch:

env:
  META_THEORY_REVISION: 087f4515d0652925eecc54bcade724445c3978f1

jobs:
  semantic-corpus:
    name: Linked semantic-source parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          repository: link-foundation/meta-theory
          ref: ${{ env.META_THEORY_REVISION }}
          path: upstream-meta-theory
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install JavaScript dependencies
        working-directory: js
        run: node ../scripts/run-with-cache.mjs -- npm ci
      - name: Compare linked syntax, declarations, and dependencies with pinned sources
        run: node scripts/run-with-cache.mjs -- node scripts/check-meta-theory-corpus.mjs upstream-meta-theory
      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-diagnostics-formal-semantic-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  lean:
    name: Lean build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          repository: link-foundation/meta-theory
          ref: ${{ env.META_THEORY_REVISION }}
          path: upstream-meta-theory
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install locked JavaScript dependencies
        run: node scripts/run-with-cache.mjs -- npm --prefix js ci
      - name: Install official Lean 4.34.1 toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build pinned Lean corpus in an owned scratch copy
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.34.1
        run: |
          node scripts/run-with-cache.mjs --cache .rml-cache/lean --class lean --isolate-output .rml-cache/lean -- bash -euo pipefail -c '
            mkdir -p "$RML_CACHE_OUTPUT_DIR/pinned"
            cp -R upstream-meta-theory/drafts/0.0.3/src/lean/. "$RML_CACHE_OUTPUT_DIR/pinned/"
            cd "$RML_CACHE_OUTPUT_DIR/pinned"
            lean --version
            lake build
          '
      - name: Validate exact-reference exports with the pinned Lean oracle
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.34.1
          NODE_OPTIONS: --max-old-space-size=768
        run: |
          node scripts/run-with-cache.mjs --cache .rml-cache/compiler --class compiler --isolate-output .rml-cache/compiler --archive "{output}/reference-exports/Lean/report" -- bash -euo pipefail -c '
            export RML_REFERENCE_OUTPUT="$RML_CACHE_OUTPUT_DIR/reference-exports/Lean"
            run_lean_oracles() {
              rustc --version
              cargo build --locked --manifest-path rust/Cargo.toml --bin rml
              node scripts/check-reference-exports.mjs --language=Lean
              node scripts/check-reference-exports.mjs --language=Lean --runtime=rust --rust-binary="$RML_CACHE_OUTPUT_DIR/debug/rml"
            }
            export -f run_lean_oracles
            node scripts/run-with-cache.mjs --isolate-output rust/target -- bash -euo pipefail -c run_lean_oracles
          '
      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-diagnostics-formal-lean-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  rocq:
    name: Rocq build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          repository: link-foundation/meta-theory
          ref: ${{ env.META_THEORY_REVISION }}
          path: upstream-meta-theory
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install locked JavaScript dependencies
        run: node scripts/run-with-cache.mjs -- npm --prefix js ci
      - name: Build pinned Rocq corpus in an owned scratch copy
        run: |
          node scripts/run-with-cache.mjs --cache .rml-cache/compiler --class compiler --isolate-output .rml-cache/compiler --archive "{output}/reference-exports/Rocq/report" -- bash -euo pipefail -c '
            export RML_REFERENCE_OUTPUT="$RML_CACHE_OUTPUT_DIR/reference-exports/Rocq"
            export RML_REFERENCE_CORPUS="$RML_CACHE_OUTPUT_DIR/pinned"
            mkdir -p "$RML_REFERENCE_OUTPUT" "$RML_REFERENCE_CORPUS"
            cp -R upstream-meta-theory/drafts/0.0.3/src/rocq/. "$RML_REFERENCE_CORPUS/"
            run_rocq_oracles() {
              rustc --version
              cargo build --locked --manifest-path rust/Cargo.toml --bin rml
              cp "$RML_CACHE_OUTPUT_DIR/debug/rml" "$RML_REFERENCE_OUTPUT/producer-rml"
              node scripts/check-reference-exports.mjs --language=Rocq --runtime=rust --rust-binary="$RML_REFERENCE_OUTPUT/producer-rml" --prepare-only
              runner_owner="$(id -u):$(id -g)"
              trap "sudo chown -R $runner_owner \"$RML_REFERENCE_OUTPUT\" \"$RML_REFERENCE_CORPUS\"" EXIT
              sudo chown -R 1000:1000 "$RML_REFERENCE_OUTPUT" "$RML_REFERENCE_CORPUS"
              bash docker/run-owned.sh --init \
                --volume "$PWD:/rml:ro" \
                --volume "$(command -v node):/usr/local/bin/node:ro" \
                --volume "$RML_REFERENCE_OUTPUT:/rml/.rml-cache/compiler" \
                --env RML_REFERENCE_OUTPUT=/rml/.rml-cache/compiler \
                --env NODE_OPTIONS=--max-old-space-size=768 \
                --volume "$RML_REFERENCE_CORPUS:/work" --workdir /work \
                rocq/rocq-prover:9.3@sha256:c357e8864f80359db21725ea8371347a75a1cb439545b47219d7ad5683ba1782 /bin/bash --login -ec \
                "bash /rml/scripts/install-rocq-kernel.sh; rocq makefile -f _CoqProject -o Makefile.coq; make -f Makefile.coq; node /rml/scripts/check-reference-exports.mjs --language=Rocq; node /rml/scripts/check-reference-exports.mjs --language=Rocq --runtime=rust --rust-binary=/rml/.rml-cache/compiler/producer-rml --validate-prepared"
            }
            export -f run_rocq_oracles
            node scripts/run-with-cache.mjs --isolate-output rust/target -- bash -euo pipefail -c run_rocq_oracles
          '
      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-diagnostics-formal-rocq-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full

  isabelle-reference-exports:
    name: Isabelle exact-reference compiler controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install repository build lifecycle
        run: node scripts/bootstrap.mjs
      - name: Install locked JavaScript dependencies
        run: node scripts/run-with-cache.mjs -- npm --prefix js ci
      - name: Validate positive and negative reference artifacts with official Isabelle
        run: |
          node scripts/run-with-cache.mjs --cache .rml-cache/compiler --class compiler --isolate-output .rml-cache/compiler --archive "{output}/reference-exports/Isabelle/report" -- bash -euo pipefail -c '
            oracle_output="$RML_CACHE_OUTPUT_DIR/reference-exports/Isabelle"
            mkdir -p "$oracle_output"
            runner_owner="$(id -u):$(id -g)"
            trap "sudo chown -R $runner_owner \"$oracle_output\"" EXIT
            sudo chown -R 1000:1000 "$oracle_output"
            bash docker/run-owned.sh --init \
              --entrypoint /bin/bash \
              --volume "$PWD:/rml:ro" \
              --volume "$(command -v node):/usr/local/bin/node:ro" \
              --volume "$oracle_output:/rml/.rml-cache/compiler" \
              --env RML_REFERENCE_OUTPUT=/rml/.rml-cache/compiler \
              --env NODE_OPTIONS=--max-old-space-size=768 \
              --workdir /rml \
              makarius/isabelle:Isabelle2025-2@sha256:9bd33b183c399327c5d554fc8cde27c29b5d2b20cdc6fe7a604caa3f951018fc \
              -ec "node scripts/check-reference-exports.mjs --language=Isabelle --compiler=/home/isabelle/Isabelle/bin/isabelle"
          '
      - name: Upload cache diagnostics before teardown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-diagnostics-formal-isabelle-${{ github.run_attempt }}
          path: |
            .rml-cache/evidence/**
            .rml-cache/reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down repository-owned build caches
        if: always()
        run: node scripts/build-cache.mjs --full
