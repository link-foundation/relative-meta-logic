name: release

# Validate the npm archive for pull requests and for crates-release.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'js/**'
      - 'scripts/npm-release*'
  workflow_call:

permissions:
  contents: read

jobs:
  npm:
    name: npm package (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Node 20 expands directory arguments to node --test.
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci
      - name: Run full JS test suite
        working-directory: js
        run: npm test
      - name: Build the package
        working-directory: js
        run: npm run build --if-present
      - name: Check package contents (dry run)
        working-directory: js
        run: npm pack --dry-run
