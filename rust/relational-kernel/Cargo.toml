[package]
name = "rml-relational-kernel"
version = "0.1.0"
edition = "2021"
description = "An independently replaceable source-defined Horn foundation for RML"
license = "Unlicense"
publish = false

[lib]
name = "rml_relational"
path = "src/lib.rs"

[dependencies]
rml = { package = "relative-meta-logic", path = ".." }
serde_json = "1.0.151"
sha2 = "0.11.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Keep both the existing S/K reference and the candidate CPU-bound witnesses
# practical without optimizing their entire dependency graph.
[profile.test.package.relative-meta-logic]
opt-level = 1

[profile.test.package.rml-relational-kernel]
opt-level = 1
