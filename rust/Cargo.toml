[package]
name = "relative-meta-logic"
version = "0.19.1"
edition = "2021"
description = "A prototype for logic framework that can reason about anything relative to given probability of input statements"
license = "Unlicense"
repository = "https://github.com/link-foundation/relative-meta-logic"
documentation = "https://docs.rs/relative-meta-logic"
readme = "README.md"
# Repository integration tests use ../examples and ../lib. Ship only runtime
# sources; cargo publish --dry-run verifies the self-contained crate in CI.
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md"]

[[bin]]
name = "rml"
path = "src/main.rs"

[[bin]]
name = "rml-check"
path = "src/bin/rml-check.rs"

[[bin]]
name = "rml-meta"
path = "src/bin/rml-meta.rs"

[lib]
name = "rml"
path = "src/lib.rs"

[dependencies]
links-notation = "0.13.0"
meta-language = "0.49.0"
