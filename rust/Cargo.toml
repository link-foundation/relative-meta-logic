[package]
name = "relative-meta-logic"
version = "0.20.0"
edition = "2021"
description = "A prototype for logic framework that can reason about anything relative to given probability of input statements"
license = "Unlicense"
repository = "https://github.com/link-foundation/relative-meta-logic"
documentation = "https://docs.rs/relative-meta-logic"
readme = "README.md"
# Repository integration tests use ../examples and ../lib. Ship only runtime
# sources; cargo publish --dry-run verifies the self-contained crate in CI.
include = ["src/**", "examples/assess_statement.rs", "Cargo.toml", "Cargo.lock", "README.md"]

[features]
default = ["std"]
core = []
std = ["core", "dep:links-notation", "dep:meta-language"]

[[bin]]
name = "rml"
path = "src/main.rs"
required-features = ["std"]

[[bin]]
name = "rml-check"
path = "src/bin/rml-check.rs"
required-features = ["std"]

[[bin]]
name = "rml-meta"
path = "src/bin/rml-meta.rs"
required-features = ["std"]

[[example]]
name = "cst_roundtrip_demo"
path = "examples/cst_roundtrip_demo.rs"
required-features = ["std"]

[[example]]
name = "assess_statement"
path = "examples/assess_statement.rs"
required-features = ["core"]

[lib]
name = "rml"
path = "src/lib.rs"

[dependencies]
links-notation = { version = "0.13.0", optional = true }
meta-language = { version = "0.49.0", optional = true }
